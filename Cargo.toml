[package]
name = "psyche-raw-utils"
version = "0.0.1"
authors = ["Kevin M. Gill <apoapsys@gmail.com>"]
edition = "2021"
description = "Utilities for working with publicly available raw Psyche images"
repository = "https://github.com/kmgill/psyche_raw_utils"
readme = "README.md"
keywords = ["psyche"]
license = "MIT"

[[bin]]
name = "pru"
path = "src/main.rs"

[profile.release]
strip = true # Automatically strip symbols from the binary.
#debug = 2

[features]

[dependencies]
image = "0.25.9"
clap = { version = "4.5.54", features = ["derive"] }
serde_json = "1.0.149"
#reqwest = { version = "0.13.1", features = ["stream"] }
reqwest = { version = "0.13.3", default-features = false, features = [
    "http2",
    "native-tls",
    "brotli",
    "gzip",
    "stream",
] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
string-builder = "0.2.0"
sciimg = { git = "https://github.com/MarsRaw/sciimg.git", branch = "main", features = [
    "rayon",
] }
#sciimg = {path = "../sciimg"}
stump = { git = "https://github.com/MarsRaw/stump.git" }
rayon = "1.11.0"
chrono = "0.4.43"
dateparser = "0.3.1"
dirs = "6.0.0"
wild = "2.2.1"
colored = "3.1.1"
backtrace = "0.3.76"
lazy_static = "1.5.0"
anyhow = "1.0.100"
tokio = { version = "1.49.0", features = ["full"] }
glob = "0.3.3"
regex = "1.12.2"
url = "2.5.8"
futures-util = "0.3.31"
indicatif = "0.18.3"
cli-table = "0.5.0"
futures = "0.3.31"

[patch.crates-io]
jpeg-decoder = { git = "https://github.com/MarsRaw/jpeg-decoder.git", branch = "optional-zero-ac63" }
